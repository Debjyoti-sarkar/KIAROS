<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <meta name="description" content="KIAROS — your voice assistant for laptop and phone" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>KIAROS</title>
  </head>
  <body>
    <canvas id="orb-canvas"></canvas>

    <div id="controls">
      <div id="devices" title="Devices connected to KIAROS">
        <span class="dev" id="dev-laptop" title="Laptop">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>
        </span>
        <span class="dev" id="dev-phone" title="Phone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>
        </span>
      </div>
      <span id="conn-dot" class="conn-disconnected" title="Connection"></span>
      <button id="btn-keyboard" title="Type a command" aria-label="Type a command">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
        </svg>
      </button>
      <button id="btn-menu" title="Menu" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>

    <div id="menu-dropdown" style="display:none">
      <button id="btn-settings">Settings</button>
      <button id="btn-pair">Pair phone</button>
      <button id="btn-connection">Change server</button>
      <button id="btn-restart">Restart server</button>
      <button id="btn-fix-self">Fix yourself</button>
    </div>

    <div id="captions" aria-live="polite"></div>

    <form id="type-form" autocomplete="off">
      <input id="type-input" type="text" placeholder="Type a command…" enterkeyhint="send" />
    </form>

    <button id="btn-talk" title="Talk" aria-label="Talk">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
      </svg>
    </button>

    <div id="status-text"></div>
    <div id="kiaros-label">KIAROS</div>
    <div id="error-text"></div>

    <div id="action-card" style="display:none">
      <button id="action-card-btn"></button>
      <button id="action-card-close" aria-label="Dismiss">&times;</button>
    </div>

    <div id="connect-screen" style="display:none">
      <form id="connect-form">
        <h1>KIAROS</h1>
        <p>Connect to the KIAROS server on your laptop.</p>
        <label>Server address
          <input id="connect-server" type="url" inputmode="url" placeholder="http://192.168.1.20:8340" required />
        </label>
        <label>Pairing token
          <input id="connect-token" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="from the laptop's Pair phone screen" />
        </label>
        <button type="submit">Connect</button>
        <p id="connect-message"></p>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
